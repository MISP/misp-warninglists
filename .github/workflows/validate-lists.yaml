# This workflow is managed by gh actions-lock.

name: Validate Lists

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  validate:
    name: Validate Lists
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            dl.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            packages.microsoft.com:443
            pypi.org:443
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          cache: pip
          python-version-file: pyproject.toml
      - name: Install Dependencies
        run: |-
          sudo apt-get update
          sudo apt-get install -y moreutils
          pip install -r pylock.test.toml --no-deps
      - name: Validate Lists
        run: ./validate_all.sh
